name: Update Data and Deploy
on:
  push:
    branches: [ main ]  # Triggers on push to main branch
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC, to pick up edits made directly in the sheet
  workflow_dispatch:      # Manual runs, and form submissions via scripts/trigger-deploy.gs

permissions:
  contents: read
  pages: write
  id-token: write

# Queue runs instead of overlapping them, so back-to-back form submissions don't race each other's deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # Geocoded coordinates and resized photos from earlier runs, so each build only fetches what's new
      - name: Restore fetch cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: fetch-cache-${{ github.run_id }}
          restore-keys: fetch-cache-

      - name: Create credentials file
        run: printf '%s' "$GOOGLE_SHEETS_CREDENTIALS" > credentials.json
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}

      - name: Fetch and transform data
        run: python scripts/fetch_data.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
