# .github/workflows/update-data.yml
name: Update Data and Deploy
on:
  push:
    branches: [ main ]  # Triggers on push to main branch
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:      # Allows manual triggers

# Important: This ensures the action has permission to deploy to Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread oauth2client google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create credentials file
        run: |
          echo '${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}' > credentials.json
        
      - name: Fetch and transform data
        run: python scripts/fetch_data.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Clear npm cache and node_modules
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-scripts --save

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4